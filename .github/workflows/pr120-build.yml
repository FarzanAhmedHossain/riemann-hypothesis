# Builds ONE module of the PR #120 branch on a GitHub runner, to verify an error or a fix with Lean itself.
# Mathlib comes from its own cache; the project modules in the target's import closure are compiled from source.
# Measured 2026-11-25: closures are 1.3k–27.5k project modules (median 8.6k), so only small ones fit in one run
# (the job limit is 6 hours). Building runs code from the upstream repository, so this workflow has NO secrets
# and a read-only token; never add secrets here.
name: pr120-build

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Lean module to build (e.g. Development.AutomorphicArithmetic.AutomorphicVarieties.UnitaryThreeDeformations.HostLocVan)"
        required: true
        default: "Development.AutomorphicArithmetic.AutomorphicVarieties.UnitaryThreeDeformations.HostLocVan"
      repo:
        description: "repository to build from (upstream, or this fork to test a fix branch)"
        default: "rohanarun/riemann-hypothesis"
      ref:
        description: "branch or commit"
        default: "opt/collapse-and-consolidate-4.36"

permissions:
  contents: read

concurrency:
  group: pr120-build-${{ github.event.inputs.module }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MOD: ${{ github.event.inputs.module }}
      SRC_REPO: ${{ github.event.inputs.repo }}
      SRC_REF: ${{ github.event.inputs.ref }}
    steps:
      - name: Validate inputs
        run: |
          node -e "
            const ok = /^[\p{L}\p{N}_.']+$/u.test(process.env.MOD) && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(process.env.SRC_REPO) && /^[A-Za-z0-9_./-]+$/.test(process.env.SRC_REF);
            const allowed = ['rohanarun/riemann-hypothesis', process.env.GITHUB_REPOSITORY];
            if (!ok || !allowed.includes(process.env.SRC_REPO)) { console.error('bad input'); process.exit(1); }"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1

      - name: Check out the module's repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install elan and the toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version

      - name: Dependencies and the Mathlib cache
        run: |
          p="src/$(printf '%s' "$MOD" | tr . /).lean"; test -f "$p" || { echo "no such module file: $p"; exit 1; }
          t0=$(date +%s)
          timeout 40m lake env true
          (cd .lake/packages/mathlib && timeout 40m lake exe cache get)
          echo "dependencies + Mathlib cache: $(( ($(date +%s) - t0) / 60 )) min"
          df -h / | tail -1

      - name: Build the module
        id: build
        run: |
          t0=$(date +%s)
          set +e
          timeout 290m lake build "$MOD" > build.log 2>&1; rc=$?
          set -e
          mins=$(( ($(date +%s) - t0) / 60 ))
          built=$(grep -c 'Built ' build.log || true)
          errs=$(grep -cE '^error:|: error:' build.log || true)
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "### pr120-build: $MOD"
            echo "- source: $SRC_REPO @ $SRC_REF"
            echo "- exit code $rc after $mins min (124 = time limit); $built modules built; $errs error line(s)"
            echo '```'
            grep -E '^error:|: error:|✖|^warning: .*declaration uses .sorry' build.log | head -40
            echo '```'
            echo "last lines:"
            echo '```'
            tail -15 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          df -h / | tail -1

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
